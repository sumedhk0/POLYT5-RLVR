[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyt5-rlvr"
version = "0.1.0"
description = "Research reproduction of polyT5 (Sahu et al., npj Artificial Intelligence 2026) plus a separate GRPO/RLVR extension"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }

dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "rdkit>=2024.3",
    "selfies>=2.1.1",
    "sentencepiece>=0.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]
track = ["tensorboard>=2.17"]
# polyt5.app imports these at module scope, so tests/test_app.py fails to COLLECT
# without them -- which aborts the whole suite, not just the app tests. They were
# undeclared until 2026-08-27 and only worked because they happened to be installed
# in the development environment; a fresh clone could not run the suite at all.
app = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The demo UI is a single self-contained page loaded from disk at request time.
# Without this it survives an editable install but vanishes from a real build.
"polyt5.app" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "gpu: requires CUDA",
    "chem: requires rdkit/selfies",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
