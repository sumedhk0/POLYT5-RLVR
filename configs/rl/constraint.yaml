# Arm C4 - REDEFINED 2026-08-23: reward is a conjunction, synthesisable AND
# novel (the Tg-window clause is REMOVED). Tg was dropped from every RLVR
# reward on this date -- see src/polyt5/rewards/composite.py's module
# docstring and this same date's amendment in
# artifacts/baseline/frozen_baseline.json. This arm has NEVER been trained --
# no data exists for it under either definition; the redefinition is a
# pre-registration made before any observation of its results.
#
# The name is KEPT, not renamed to `synthesisability` -- this is a different,
# STRICTER reward than that arm (SA AND novel, vs SA alone): it preserves C4's
# original character as the multi-criterion conjunction rather than
# duplicating the single-axis arm. See ConstraintArm's own docstring in
# src/polyt5/rewards/composite.py.
#
# Because the name is unchanged, every key below that fed the now-removed
# Tg clause is explicitly marked dead so this file cannot be mistaken for
# still producing the old reward.
# Phase 3. NOT part of the published polyT5 method - see docs/rlvr_plan.md.
experiment_name: grpo_constraint
arm: constraint
seed: 0

baseline: artifacts/baseline/frozen_baseline.json   # checkpoints + SHA-256 come from here

reward:
  tolerance: 100.0        # DEAD as of 2026-08-23 (fed the removed Tg clause); unused; kept so configs stay comparable
  sigma0: 17.0            # DEAD as of 2026-08-23 (fed the removed Tg clause); unused; kept so configs stay comparable
  sigma_unknown: 45.2     # DEAD as of 2026-08-23 (fed the removed Tg clause); unused; kept so configs stay comparable
  min_coverage: 0.5       # DEAD as of 2026-08-23 (fed the removed ensemble_backed clause); unused; kept so configs stay comparable
  sa_max: 6.0             # STILL LIVE: maximum acceptable SA score (constraint_reward's synthesisable test)
  window_tolerance: 50.0  # DEAD as of 2026-08-23 (fed the removed Tg-window clause); unused; kept so configs stay comparable
  novelty_index: artifacts/novelty/tg_generation_train  # STILL LIVE: novel test needs it

train:
  group_size: 16          # candidates per prompt; the GRPO baseline
  prompts_per_step: 32    # 512 candidates per step
  max_steps: 2000
  max_length: 200         # [PAPER] the paper's sequence limit
  target_min: 250.0       # uniform sampling forces genuine conditioning
  target_max: 600.0
  temperature: 0.7        # arm B's tuned operating point
  top_p: 0.95
  learning_rate: 1.0e-6
  clip_eps: 0.2
  kl_coef: 0.02           # primary knob; KL is logged every step
  max_grad_norm: 1.0
  rollout_batch_size: 128 # measured optimum; 512 is 3.5x slower
  log_every: 10
  save_every: 100
  device: auto

# Spec 4.4 drift monitoring. LOGGING ONLY: the auditor loaded here is handed to
# polyt5.rl.DriftMonitor and is never passed to the reward arm (see
# scripts/train_grpo.py's module docstring). --no-drift-monitor overrides this.
drift:
  enabled: true
  every: 50                                         # steps between measurements; step 0 always measured
  reference: data/processed/tg/generation/train.jsonl  # labelled Tg set for max-Tanimoto
  max_reference: 20000

output:
  results_root: results
